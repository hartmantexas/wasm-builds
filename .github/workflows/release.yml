name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild assets from parts and verify
        run: |
          set -e
          d=parts/${GITHUB_REF_NAME}
          mkdir -p out
          for p in $(ls $d | sed -E 's/\.part-[0-9]+$//' | sort -u); do
            cat $d/$p.part-* > out/$p
          done
          cp SHA256SUMS out/
          (cd out && sha256sum -c SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Desktops $GITHUB_REF_NAME" --notes "Browser-ready desktop machines. Verify with sha256sum -c SHA256SUMS."
