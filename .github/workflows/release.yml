name: release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['RELEASE']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild assets from parts and verify
        run: |
          set -e
          TAG=$(cat RELEASE); echo "TAG=$TAG" >> $GITHUB_ENV
          d=parts/$TAG
          mkdir -p out
          for p in $(ls $d | sed -E 's/\.part-[0-9]+$//' | sort -u); do
            cat $d/$p.part-* > out/$p
          done
          cp SHA256SUMS out/
          (cd out && sha256sum -c SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" out/* --title "Desktops $TAG" --notes "Browser-ready desktop machines. Verify with sha256sum -c SHA256SUMS."
