name: release
# The factory pushes ONE orphan branch stage/<tag> holding the split parts. CI joins them, verifies sha256, publishes the
# release, then deletes the branch, so main never carries machine bytes.
on:
  workflow_dispatch:
  push:
    branches: ['stage/**', main]
    paths: ['RELEASE']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild assets from parts and verify
        run: |
          set -e
          TAG=$(cat RELEASE); echo "TAG=$TAG" >> $GITHUB_ENV
          d=parts/$TAG
          mkdir -p out
          for p in $(ls $d | sed -E 's/\.part-[0-9]+$//' | sort -u); do
            cat $d/$p.part-* > out/$p
          done
          cp SHA256SUMS out/
          (cd out && sha256sum -c SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" out/* --clobber
          else gh release create "$TAG" out/* --title "Machines $TAG" --notes "Browser-ready machines. Verify with sha256sum -c SHA256SUMS."; fi
      - name: Drop the staging branch
        if: startsWith(github.ref, 'refs/heads/stage/')
        run: git push origin --delete "${GITHUB_REF#refs/heads/}"
